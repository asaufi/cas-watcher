name: Surveillance communiqués TAS

on:
  schedule:
    - cron: "*/15 * * * *"      # toutes les 15 minutes (UTC)
  workflow_dispatch:             # lancement manuel depuis l'onglet Actions
    inputs:
      test_email:
        description: "Envoyer un mail de test"
        type: boolean
        default: false

permissions:
  contents: write                # nécessaire pour commiter seen.json

concurrency:                     # évite deux exécutions simultanées
  group: cas-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Vérifier le site
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: saufianas03@gmail.com
          TEST_EMAIL: ${{ inputs.test_email && '1' || '0' }}
        run: python check_cas.py

      - name: Sauvegarder l'état (seen.json)
        run: |
          # On ne commite que si le fichier a changé -> pas de commit inutile
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "maj communiqués vus"
            git push
          fi
